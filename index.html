<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>2WW Colorectal Pathway</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e3a5f">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
  :root{--bg:#f3f5f6;--surface:#fff;--text:#14191d;--muted:#5d6870;--border:rgba(20,30,38,.22);--accent:#1e3a5f;--accent-ink:#fff;--danger:#a3271b;}
  @media (prefers-color-scheme: dark){:root{--bg:#121415;--surface:#1a1d1f;--text:#f4f5f5;--muted:#a3abb0;--border:rgba(255,255,255,.24);--accent:#5b86ad;--accent-ink:#0d1416;--danger:#f08a7e;color-scheme:dark;}}
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px 16px;}
  main{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:28px 26px;}
  h1{font-size:20px;line-height:1.3;margin:0 0 6px;}
  p{margin:0 0 18px;color:var(--muted);font-size:14px;}
  label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;}
  input{width:100%;padding:11px 12px;border-radius:9px;border:1px solid var(--border);background:var(--bg);color:var(--text);font:inherit;}
  input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  button{width:100%;margin-top:14px;padding:11px 12px;border-radius:9px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:600;cursor:pointer;}
  button:disabled{opacity:.6;cursor:default;}
  #msg{min-height:20px;margin:12px 0 0;font-size:13.5px;color:var(--danger);}
</style>
</head>
<body>
<main>
  <h1>2WW Colorectal Pathway</h1>
  <p>Enter the password to open the tool.</p>
  <form id="f" autocomplete="off">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required autofocus>
    <button id="go" type="submit">Open</button>
    <div id="msg" role="alert"></div>
  </form>
</main>
<script>
(function(){
  "use strict";
  var SS = 'pathway-key';
  function b64(s){ var bin = atob(s), a = new Uint8Array(bin.length); for (var i=0;i<bin.length;i++) a[i] = bin.charCodeAt(i); return a; }
  function toB64(a){ var s=''; for (var i=0;i<a.length;i++) s += String.fromCharCode(a[i]); return btoa(s); }
  var msg = document.getElementById('msg'), go = document.getElementById('go');

  function getBin(url){
    return fetch(url, {cache:'no-store'}).then(function(r){ if(!r.ok) throw new Error('load'); return r.arrayBuffer(); });
  }
  function openWith(rawKey){
    return Promise.all([crypto.subtle.importKey('raw', rawKey, 'AES-GCM', false, ['decrypt']), getBin('app.enc')])
      .then(function(r){
        var buf = new Uint8Array(r[1]);
        return crypto.subtle.decrypt({name:'AES-GCM', iv:buf.slice(0,12)}, r[0], buf.slice(12));
      }).then(function(plain){
        var html = new TextDecoder().decode(plain);
        document.open(); document.write(html); document.close();
      });
  }
  function unlock(password){
    return fetch('key.json', {cache:'no-store'}).then(function(r){ if(!r.ok) throw new Error('load'); return r.json(); })
      .then(function(k){
        return crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey'])
          .then(function(base){
            return crypto.subtle.deriveKey({name:'PBKDF2', hash:'SHA-256', salt:b64(k.salt), iterations:k.iter}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
          }).then(function(kek){
            return crypto.subtle.decrypt({name:'AES-GCM', iv:b64(k.iv)}, kek, b64(k.wrapped));
          });
      }).then(function(rawKey){
        var bytes = new Uint8Array(rawKey);
        try { sessionStorage.setItem(SS, toB64(bytes)); } catch(e){}
        return openWith(bytes);
      });
  }

  if (!window.crypto || !crypto.subtle){
    msg.textContent = 'This browser cannot open the tool. Please use a current version of Edge, Chrome, Safari or Firefox.';
    go.disabled = true; return;
  }
  // Same browser tab already unlocked: reopen without asking again.
  try {
    var saved = sessionStorage.getItem(SS);
    if (saved){ openWith(b64(saved)).catch(function(){ try{ sessionStorage.removeItem(SS); }catch(e){} }); }
  } catch(e){}

  document.getElementById('f').addEventListener('submit', function(ev){
    ev.preventDefault();
    var pw = document.getElementById('pw').value;
    if (!pw) return;
    msg.textContent = ''; go.disabled = true; go.textContent = 'Opening…';
    unlock(pw).catch(function(err){
      go.disabled = false; go.textContent = 'Open';
      msg.textContent = (err && err.message === 'load')
        ? 'The tool could not be loaded. Check your connection and try again.'
        : 'That password is not correct. Please try again.';
    });
  });
})();
</script>
</body>
</html>
